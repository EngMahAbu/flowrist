name: flowrist
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  injectable: ^3.0.0
  get_it: ^9.2.1
  retrofit: ^4.9.0
  logger: ^2.6.0
  json_annotation: ^4.9.0
  dio: ^5.10.0
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^17.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  injectable_generator: ^3.0.2
  build_runner: ^2.15.0
  retrofit_generator: ^10.0.1
  json_serializable: ^6.10.0
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  bloc_test: ^10.0.0


flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_Regular.ttf
    - family: FloweryIcons
      fonts:
        - asset: assets/fonts/FloweryIcons.ttf
